{% extends "base.html" %}
{% block title %}Edit {{ stock_type|capitalize }} - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card shadow"><div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-pencil"></i> Edit {{ stock_type|capitalize }}</h4></div>
<div class="card-body"><form method="POST">
{% if stock_type == 'poultry' %}
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Bird Type</label><select name="bird_type" class="form-select">{% for t in types %}<option {% if stock.bird_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Breed</label><input type="text" name="breed" class="form-control" value="{{ stock.breed }}"></div>
        <div class="col-md-4"><label class="form-label">Batch Name</label><input type="text" name="batch_name" class="form-control" value="{{ stock.batch_name }}"></div>
        <div class="col-md-3"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" value="{{ stock.quantity }}"></div>
        <div class="col-md-3"><label class="form-label">Age (weeks)</label><input type="number" name="age_weeks" class="form-control" value="{{ stock.age_weeks or 0 }}"></div>
        <div class="col-md-3"><label class="form-label">Avg Weight</label><input type="number" name="avg_weight_kg" class="form-control" step="0.1" value="{{ stock.avg_weight_kg or 0 }}"></div>
        <div class="col-md-3"><label class="form-label">Unit Price</label><input type="number" name="unit_price" class="form-control" step="0.01" value="{{ stock.unit_price or 0 }}"></div>
        <div class="col-md-6"><label class="form-label">Housing</label><input type="text" name="housing" class="form-control" value="{{ stock.housing }}"></div>
        <div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in statuses %}<option {% if stock.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ stock.notes }}</textarea></div>
    </div>
{% else %}
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Animal Type</label><select name="animal_type" class="form-select">{% for t in types %}<option {% if stock.animal_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Breed</label><input type="text" name="breed" class="form-control" value="{{ stock.breed }}"></div>
        <div class="col-md-4"><label class="form-label">Tag ID</label><input type="text" name="tag_id" class="form-control" value="{{ stock.tag_id }}"></div>
        <div class="col-md-3"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" value="{{ stock.quantity }}"></div>
        <div class="col-md-3"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">-</option><option {% if stock.gender=='Male' %}selected{% endif %}>Male</option><option {% if stock.gender=='Female' %}selected{% endif %}>Female</option></select></div>
        <div class="col-md-3"><label class="form-label">Age (months)</label><input type="number" name="age_months" class="form-control" value="{{ stock.age_months or 0 }}"></div>
        <div class="col-md-3"><label class="form-label">Weight (kg)</label><input type="number" name="weight_kg" class="form-control" step="0.1" value="{{ stock.weight_kg or 0 }}"></div>
        <div class="col-md-4"><label class="form-label">Health</label><input type="text" name="health_status" class="form-control" value="{{ stock.health_status }}"></div>
        <div class="col-md-4"><label class="form-label">Housing</label><input type="text" name="housing" class="form-control" value="{{ stock.housing }}"></div>
        <div class="col-md-4"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in statuses %}<option {% if stock.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ stock.notes }}</textarea></div>
    </div>
{% endif %}
    <div class="mt-3"><button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-circle"></i> Update</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
