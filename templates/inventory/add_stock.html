{% extends "base.html" %}
{% block title %}Add {{ stock_type|capitalize }} - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card shadow"><div class="card-header bg-success text-white"><h4 class="mb-0"><i class="bi bi-plus-circle"></i> Add {{ stock_type|capitalize }}</h4></div>
<div class="card-body"><form method="POST">
{% if stock_type == 'poultry' %}
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Bird Type *</label><select name="bird_type" class="form-select" required>{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Breed</label><input type="text" name="breed" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Batch Name *</label><input type="text" name="batch_name" class="form-control" required placeholder="e.g., Batch-A-Jan2024"></div>
        <div class="col-md-3"><label class="form-label">Quantity *</label><input type="number" name="quantity" class="form-control" required min="1"></div>
        <div class="col-md-3"><label class="form-label">Age (weeks)</label><input type="number" name="age_weeks" class="form-control" min="0"></div>
        <div class="col-md-3"><label class="form-label">Avg Weight (kg)</label><input type="number" name="avg_weight_kg" class="form-control" step="0.1"></div>
        <div class="col-md-3"><label class="form-label">Unit Price (GH₵)</label><input type="number" name="unit_price" class="form-control" step="0.01"></div>
        <div class="col-md-4"><label class="form-label">Housing/Pen</label><input type="text" name="housing" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Date Acquired</label><input type="date" name="date_acquired" class="form-control"></div>
        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    </div>
{% else %}
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Animal Type *</label><select name="animal_type" class="form-select" required>{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Breed</label><input type="text" name="breed" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Tag ID</label><input type="text" name="tag_id" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Batch Name</label><input type="text" name="batch_name" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Quantity *</label><input type="number" name="quantity" class="form-control" required min="1" value="1"></div>
        <div class="col-md-3"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">-</option><option>Male</option><option>Female</option></select></div>
        <div class="col-md-3"><label class="form-label">Age (months)</label><input type="number" name="age_months" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Weight (kg)</label><input type="number" name="weight_kg" class="form-control" step="0.1"></div>
        <div class="col-md-3"><label class="form-label">Color/Markings</label><input type="text" name="color_markings" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Unit Price (GH₵)</label><input type="number" name="unit_price" class="form-control" step="0.01"></div>
        <div class="col-md-3"><label class="form-label">Health</label><select name="health_status" class="form-select"><option>Healthy</option><option>Sick</option><option>Quarantined</option></select></div>
        <div class="col-md-4"><label class="form-label">Housing</label><input type="text" name="housing" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Vaccination</label><input type="text" name="vaccination_status" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Date Acquired</label><input type="date" name="date_acquired" class="form-control"></div>
        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    </div>
{% endif %}
    <div class="mt-3"><button type="submit" class="btn btn-success btn-lg"><i class="bi bi-check-circle"></i> Save</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
