{% extends "base.html" %}
{% block title %}Daily Egg Collection - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow border-warning">
            <div class="card-header bg-warning text-white">
                <h4 class="mb-0"><i class="bi bi-basket-fill"></i> Log Today's Egg Collection</h4>
                <small class="opacity-75">Quick entry for daily collection</small>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Egg Type</label>
                            <select name="egg_type" class="form-select">
                                {% for t in egg_types %}<option>{{ t }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Color</label>
                            <select name="egg_color" class="form-select">
                                {% for c in colors %}<option {% if c == 'Brown' %}selected{% endif %}>{{ c }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Full Crates Collected</label>
                            <input type="number" name="crates_in_stock" class="form-control form-control-lg" min="0" value="0" required>
                            <small class="text-muted">1 crate = 30 eggs</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Loose Eggs (extra)</label>
                            <input type="number" name="loose_eggs" class="form-control form-control-lg" min="0" value="0">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Source Batch (Optional)</label>
                            <input type="text" name="source_batch" class="form-control" placeholder="e.g., Layer Batch A">
                        </div>
                    </div>
                    <div class="alert alert-info mt-3">
                        <i class="bi bi-info-circle-fill"></i>
                        <div>
                            <strong>Auto-filled:</strong>
                            Collection date = today, Expiry = 28 days from today, Grade A, Available
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg w-100">
                        <i class="bi bi-check-circle-fill"></i> Log Collection
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
