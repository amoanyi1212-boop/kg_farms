{% extends "base.html" %}
{% block title %}Edit Feed - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card shadow"><div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Feed</h4></div>
<div class="card-body"><form method="POST"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Feed Name</label><select name="feed_name" class="form-select">{% for t in feed_types %}<option {% if feed.feed_name==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Category</label><input type="text" name="feed_category" class="form-control" value="{{ feed.feed_category }}"></div>
    <div class="col-md-4"><label class="form-label">Quantity</label><input type="number" name="quantity_in_stock" class="form-control" step="0.1" value="{{ feed.quantity_in_stock }}"></div>
    <div class="col-md-4"><label class="form-label">Unit</label><select name="unit" class="form-select">{% for u in units %}<option {% if feed.unit==u %}selected{% endif %}>{{ u }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Unit Cost</label><input type="number" name="unit_cost" class="form-control" step="0.01" value="{{ feed.unit_cost or 0 }}"></div>
    <div class="col-md-4"><label class="form-label">Reorder Level</label><input type="number" name="reorder_level" class="form-control" step="0.1" value="{{ feed.reorder_level }}"></div>
    <div class="col-md-4"><label class="form-label">Supplier</label><input type="text" name="supplier" class="form-control" value="{{ feed.supplier }}"></div>
    <div class="col-md-4"><label class="form-label">Location</label><input type="text" name="storage_location" class="form-control" value="{{ feed.storage_location }}"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ feed.notes }}</textarea></div>
</div><button type="submit" class="btn btn-primary btn-lg w-100 mt-3"><i class="bi bi-check-circle"></i> Update</button></form></div></div>
</div></div>
{% endblock %}
