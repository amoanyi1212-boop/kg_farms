{% extends "base.html" %}
{% block title %}Add Feed - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card shadow"><div class="card-header bg-warning text-dark"><h4 class="mb-0"><i class="bi bi-basket"></i> Add Feed to Inventory</h4></div>
<div class="card-body"><form method="POST"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Feed Name *</label><select name="feed_name" class="form-select" required>{% for t in feed_types %}<option>{{ t }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Category</label><select name="feed_category" class="form-select"><option>Poultry Feed</option><option>Livestock Feed</option><option>Supplement</option><option>Raw Material</option></select></div>
    <div class="col-md-4"><label class="form-label">Quantity *</label><input type="number" name="quantity_in_stock" class="form-control" required step="0.1"></div>
    <div class="col-md-4"><label class="form-label">Unit</label><select name="unit" class="form-select">{% for u in units %}<option>{{ u }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Unit Cost (GH₵)</label><input type="number" name="unit_cost" class="form-control" step="0.01"></div>
    <div class="col-md-4"><label class="form-label">Reorder Level</label><input type="number" name="reorder_level" class="form-control" step="0.1" value="50"></div>
    <div class="col-md-4"><label class="form-label">Supplier</label><input type="text" name="supplier" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Batch Number</label><input type="text" name="batch_number" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Expiry Date</label><input type="date" name="expiry_date" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Storage Location</label><input type="text" name="storage_location" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Date Received</label><input type="date" name="date_received" class="form-control"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
</div><button type="submit" class="btn btn-warning text-dark btn-lg w-100 mt-3 fw-bold"><i class="bi bi-check-circle"></i> Save Feed</button></form></div></div>
</div></div>
{% endblock %}
