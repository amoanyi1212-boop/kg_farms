{% extends "base.html" %}
{% block title %}Log Feeding - K&G Farms{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card shadow"><div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-journal-plus"></i> Log Feeding</h4></div>
<div class="card-body"><form method="POST"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Feed *</label><select name="feed_id" class="form-select" required>{% for f in feeds %}<option value="{{ f.id }}">{{ f.feed_name }} ({{ f.quantity_in_stock }} {{ f.unit }} left)</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Target Group *</label><input type="text" name="target_group" class="form-control" required placeholder="e.g., Broiler Pen A"></div>
    <div class="col-md-4"><label class="form-label">Animal Type *</label><select name="animal_type" class="form-select" required><option>Poultry</option><option>Livestock</option></select></div>
    <div class="col-md-4"><label class="form-label">Quantity Given *</label><input type="number" name="quantity_given" class="form-control" required step="0.1"></div>
    <div class="col-md-4"><label class="form-label">Feeding Time</label><select name="feeding_time" class="form-select"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div>
    <div class="col-md-6"><label class="form-label">Date</label><input type="date" name="date_given" class="form-control"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
</div><button type="submit" class="btn btn-primary btn-lg w-100 mt-3"><i class="bi bi-check-circle"></i> Log Feeding</button></form></div></div>
</div></div>
{% endblock %}
